name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de física
        run: npm run test:physics

      - name: Compilar proyecto Angular
        run: npx ng build --base-href "/JosiasPariMamaniProyectoFisica2/"

      - name: Subir archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/fisica2-unidades-1-2/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4